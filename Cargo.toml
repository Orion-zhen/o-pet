[package]
name = "o-pet"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Cross-platform desktop pet for Pi"
repository = "https://github.com/Orion-zhen/o-pet"
readme = "README.md"

[dependencies]
async-channel = "2.5"
directories = "6.0"
interprocess = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
widestring = "1.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.56", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8"
webkit6 = "0.6"

[dev-dependencies]
tempfile = "3.21"
