[package]
name = "o-pet"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Cross-platform desktop pet for Pi"
repository = "https://github.com/Orion-zhen/o-pet"
readme = "README.md"

[dependencies]
async-channel = "*"
csscolorparser = "*"
directories = "*"
interprocess = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
toml = "*"

[target.'cfg(unix)'.dependencies]
libc = "*"

[target.'cfg(windows)'.dependencies]
sha2 = "*"
widestring = "*"
windows = { version = "*", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = { version = "*", default-features = false, features = ["rwh_06"] }
wry = { version = "*", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "*"
objc2-app-kit = { version = "*", default-features = false, features = ["std", "NSColor", "NSWindow"] }
objc2-foundation = { version = "*", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "*", features = ["v4_10"] }
gtk4-layer-shell = "*"
webkit6 = "*"

[dev-dependencies]
tempfile = "*"
